<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Session 02 PDCA — Social Card</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  background: #f0f0f0;
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
}

/* Social card: 1200x630 ratio */
.social-card {
  width: 1200px;
  height: 630px;
  background: linear-gradient(135deg, #FFFFFF 0%, #FFEAEB 100%);
  position: relative;
  overflow: hidden;
  display: grid;
  grid-template-columns: 1fr 1fr;
}

/* Left side - content */
.card-left {
  padding: 60px 50px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  z-index: 2;
}
.card-badge {
  display: inline-block;
  background: #E31F26;
  color: white;
  font-size: 14px;
  font-weight: 700;
  padding: 6px 16px;
  border-radius: 999px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  margin-bottom: 20px;
  width: fit-content;
}
.card-title {
  font-size: 52px;
  font-weight: 800;
  color: #2C2B2B;
  line-height: 1.15;
  margin-bottom: 16px;
}
.card-title span { color: #E31F26; }
.card-subtitle {
  font-size: 20px;
  color: #696969;
  line-height: 1.5;
  margin-bottom: 28px;
}
.card-tags {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}
.card-tag {
  background: rgba(0, 153, 255, 0.1);
  border: 1px solid rgba(0, 153, 255, 0.3);
  color: #0099FF;
  font-size: 13px;
  font-weight: 600;
  padding: 6px 14px;
  border-radius: 6px;
}
.card-footer {
  position: absolute;
  bottom: 30px;
  left: 50px;
  display: flex;
  align-items: center;
  gap: 12px;
}
.card-footer-text {
  font-size: 14px;
  color: #696969;
}
.card-footer-text strong { color: #E31F26; }

/* Right side - PDCA visual */
.card-right {
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
}
.pdca-visual {
  width: 380px;
  height: 380px;
  position: relative;
}
.pdca-circle {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  border: 4px dashed rgba(227, 31, 38, 0.2);
  position: relative;
  animation: rotate 20s linear infinite;
}
@keyframes rotate {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}
.pdca-node {
  position: absolute;
  width: 100px;
  height: 100px;
  border-radius: 16px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  box-shadow: 0 8px 24px rgba(0,0,0,0.1);
  animation: rotate 20s linear infinite reverse;
}
.pdca-node.n-plan {
  top: -10px; left: 50%; transform: translateX(-50%);
  background: linear-gradient(135deg, #0099FF, #0077CC);
  color: white;
}
.pdca-node.n-do {
  top: 50%; right: -10px; transform: translateY(-50%);
  background: linear-gradient(135deg, #34C759, #28A745);
  color: white;
}
.pdca-node.n-check {
  bottom: -10px; left: 50%; transform: translateX(-50%);
  background: linear-gradient(135deg, #FF9500, #E68600);
  color: white;
}
.pdca-node.n-act {
  top: 50%; left: -10px; transform: translateY(-50%);
  background: linear-gradient(135deg, #E31F26, #C41920);
  color: white;
}
.pdca-node .node-letter {
  font-size: 28px;
  font-weight: 800;
}
.pdca-node .node-word {
  font-size: 12px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  margin-top: 2px;
}
.center-text {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  text-align: center;
  z-index: 3;
}
.center-text .loop-icon {
  font-size: 40px;
  color: #E31F26;
}
.center-text .loop-label {
  font-size: 13px;
  color: #696969;
  font-weight: 600;
  margin-top: 4px;
}

/* Decorative */
.deco-dots {
  position: absolute;
  top: 40px;
  right: 40px;
  width: 60px;
  height: 60px;
  background: radial-gradient(circle, #E31F26 2px, transparent 2px);
  background-size: 12px 12px;
  opacity: 0.3;
}
</style>
</head>
<body>

<div class="social-card">
  <div class="deco-dots"></div>

  <div class="card-left">
    <div class="card-badge">Buổi 2 Preview</div>
    <div class="card-title"><span>PDCA</span><br>Operation</div>
    <div class="card-subtitle">Vận hành workspace bằng<br>vòng lặp cải tiến liên tục</div>
    <div class="card-tags">
      <span class="card-tag">Plan</span>
      <span class="card-tag">Do</span>
      <span class="card-tag">Check</span>
      <span class="card-tag">Act</span>
    </div>
    <div class="card-footer">
      <div class="card-footer-text"><strong>MindX</strong> — Agentic AI với Google Antigravity</div>
    </div>
  </div>

  <div class="card-right">
    <div class="pdca-visual">
      <div class="pdca-circle">
        <div class="pdca-node n-plan">
          <span class="node-letter">P</span>
          <span class="node-word">Plan</span>
        </div>
        <div class="pdca-node n-do">
          <span class="node-letter">D</span>
          <span class="node-word">Do</span>
        </div>
        <div class="pdca-node n-check">
          <span class="node-letter">C</span>
          <span class="node-word">Check</span>
        </div>
        <div class="pdca-node n-act">
          <span class="node-letter">A</span>
          <span class="node-word">Act</span>
        </div>
      </div>
      <div class="center-text">
        <div class="loop-icon">↻</div>
        <div class="loop-label">Iterate</div>
      </div>
    </div>
  </div>
</div>

</body>
</html>
